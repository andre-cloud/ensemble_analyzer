version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # setuptools-scm derives the version from the git tags; RTD clones shallow
    post_checkout:
      - git fetch --unshallow --tags || git fetch --tags || true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/source/conf.py