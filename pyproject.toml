[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-analyzer"
# Version from the git tag (e.g. tag 1.2.2 -> 1.2.2), see [tool.setuptools_scm]
dynamic = ["version"]
description = "Automatic Refinement of Conformational Ensemble"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

authors = [
    { name = "Andrea Pellegrini", email = "andrea.pellegrini15@unibo.it" },
    { name = "Paolo Righi", email = "paolo.righi@unibo.it" },
    { name = "Andrea Mazzanti", email = "andrea.mazzanti@unibo.it" },
    { name = "Michele Mancinelli", email = "michele.mancinelli@unibo.it" },
]

maintainers = [
    { name = "Andrea Pellegrini", email = "andrea.pellegrini15@unibo.it" },
    { name = "Paolo Righi", email = "paolo.righi@unibo.it" },
]

keywords = [
    "computational-chemistry",
    "conformational-analysis",
    "ensemble-refinement",
    "automatization",
    "ase",
    "quantum-chemistry",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

# Lower bounds: oldest versions the test suite passes with
# (uv pip compile --resolution lowest-direct, Python 3.12).
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "ase>=3.23",
    "numba>=0.60",
    "tabulate>=0.9",
    "InquirerPy>=0.3.4",
    "textual>=2.0.0",
    "sella>=2.3.5",
]

# One extra per backend; `ml` (= `all`) installs every backend that can share an
# environment. MACE models run with the e3nn>=0.5 required by UMA/FAIRChem
# (enan_calculators._mace rebuilds them), but mace-torch pins e3nn==0.4.4 in its
# metadata, so with pip the `ml` environment gets mace-torch through
#     pip install --no-deps mace-torch
# (its runtime dependencies are already listed below). uv users get it through
# [tool.uv] override-dependencies.
[project.optional-dependencies]
# PRISM similarity pruning (prune_method = "prism" / "prism_rotcorr")
prism = ["prism_pruner>=0.1.2"]
tblite = ["tblite"]
aimnet = ["aimnet"]
uma = ["fairchem-core"]
fairchem = ["fairchem-core"]
mace = ["mace-torch"]
skala = ["skala"]
ml = [
    "tblite",
    "aimnet",
    "fairchem-core",
    "skala",
    # mace-torch runtime dependencies (mace-torch itself: pip install --no-deps mace-torch)
    "opt_einsum",
    "torch-ema",
    "prettytable",
    "matscipy",
    "h5py",
    "torchmetrics",
    "python-hostlist",
    "configargparse",
    "GitPython",
    "pyYAML",
    "tqdm",
    "lmdb",
    "orjson",
    "pandas",
]
all = [
    "prism_pruner>=0.1.2",
    "tblite",
    "aimnet",
    "fairchem-core",
    "skala",
    "opt_einsum",
    "torch-ema",
    "prettytable",
    "matscipy",
    "h5py",
    "torchmetrics",
    "python-hostlist",
    "configargparse",
    "GitPython",
    "pyYAML",
    "tqdm",
    "lmdb",
    "orjson",
    "pandas",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme",
    "myst-parser",
    "mock",
    "sphinx-design",
    "sphinx-copybutton",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "prism_pruner>=0.1.2",
]

[project.scripts]
enan_check = "ensemble_analyzer.cli.check_setup:main"
ensemble_analyzer = "ensemble_analyzer.launch:main"
enan_regraph = "ensemble_analyzer.cli.regraph:main"
enan_graph_editor = "ensemble_analyzer.cli.pickle_editor.cli:main"
enan_protocol_wizard = "ensemble_analyzer.cli.protocol_wizard:main"
enan_get_energies = "ensemble_analyzer.cli.get_av_energy:main"
enan_clustering = "ensemble_analyzer.cli.clustering:main"

[project.urls]
Homepage = "https://github.com/andre-cloud/ensemble_analyzer"
Documentation = "https://enan.readthedocs.io/en/latest/"
Changelog = "https://github.com/andre-cloud/ensemble_analyzer/blob/main/CHANGELOG.md"
Releases = "https://github.com/andre-cloud/ensemble_analyzer/releases"
Issues = "https://github.com/andre-cloud/ensemble_analyzer/issues"

[tool.setuptools]
include-package-data = true
packages.find = { where = ["src"] }

[tool.setuptools.package-data]
ensemble_analyzer = ["parameters_file/*"]

[tool.setuptools_scm]
# Tags are plain versions (1.2.2). Without git metadata (e.g. a shallow clone
# without tags) the build still works and reports this version.
fallback_version = "0.0.0"

[tool.uv]
# mace-torch pins e3nn==0.4.4; MACE models run with e3nn>=0.5 (see
# enan_calculators._mace), which UMA/FAIRChem need.
override-dependencies = ["e3nn>=0.5"]

[tool.pytest.ini_options]
testpaths = ["test"]
