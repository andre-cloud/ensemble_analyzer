# Publish to PyPI when a GitHub Release is published.
#
# Flow: feature branch -> bleed -> main -> tag on main (e.g. 1.2.2, no "v")
# -> GitHub Release from that tag -> this workflow builds and uploads to PyPI.
#
# Uses PyPI Trusted Publishing (OIDC, no API token). One-time setup:
#   - PyPI > ensemble-analyzer > Publishing > Add a trusted publisher:
#     owner andre-cloud, repository ensemble_analyzer, workflow release.yml,
#     environment pypi
#   - GitHub > Settings > Environments > create "pypi"
# PEP 740 attestations are generated by default, so every file on PyPI is
# linked to this repository, tag/commit and workflow run.

name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the pyproject version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag=${TAG} pyproject=${VERSION}"
          if [ "${TAG}" != "${VERSION}" ]; then
            echo "::error::Release tag ${TAG} does not match pyproject version ${VERSION}"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ensemble-analyzer/${{ github.event.release.tag_name }}/
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
